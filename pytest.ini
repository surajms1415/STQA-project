[pytest]
testpaths = python_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit test cases for pricing, quantity, stock, and calculations
    integration: Integration test cases for cart, orders, and state persistence
    blackbox: Black box boundary tests for inputs, quantities, and checkout
    functional: Functional system test cases for search, cart, and E2E workflow
    defects: Defect lifecycle, bug exposure, and regression verification
