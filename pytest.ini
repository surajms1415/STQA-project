[pytest]
testpaths = python_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:playwright
markers =
    unit: Unit test cases for pricing, quantity, stock, and calculations
    integration: Integration test cases for cart, orders, and state persistence
    functional: Functional system test cases for search, cart, and E2E workflow
    blackbox: Black box tests using inputs and expected outputs
    regression: Regression test cases verifying bug fixes and continuous stability
    boundary: Boundary value tests for min, max, threshold, and edge values
    negative: Negative tests verifying error handling for invalid/malformed inputs
    validation: Validation tests for forms, schema, regex, and data constraints
    defects: Defect lifecycle, bug exposure, and patch verification
    playwright: End-to-end browser automation tests using Playwright
    api: REST API demonstration tests using Python Requests
    security: Security test cases checking sanitization, XSS, injection resistance, and sensitive data leakage
    performance: Performance benchmarks checking page load, execution time, and concurrent requests
